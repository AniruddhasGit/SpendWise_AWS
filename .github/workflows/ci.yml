name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

#-----------------------------------------------------------------
##ASSEMBLE AND TEST THE APPLICATION IN A CONTAINERIZED ENVIRONMENT
#-----------------------------------------------------------------
jobs:
  assemble:
    name: Assemble — dependencies install
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

#---------------------------------------------------------
##COMPILE AND IMPORT THE APPLICATION TO ENSURE IT IS VALID
#---------------------------------------------------------
      - name: Compile every source file
        run: python -m compileall -q app/ tests/ tools/

      - name: Import the application
        env:
          SPENDWISE_DOTENV: "0"
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
          MIGRATION_DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
          JWT_SECRET: ci_only_not_a_real_secret_padded_to_32_bytes
        run: python -c "import app.main; print('app imports')"

#-----------------------------------------------------------------------       
## BUILD AN IMAGE TO TEST THE APPLICATION IN A CONTAINERIZED ENVIRONMENT
#----------------------------------------------------------------------- 
  image:
    name: Build the container image
    runs-on: ubuntu-latest
    needs: assemble
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: spendwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d spendwise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t spendwise:ci .

      - name: Start the container
        run: |
          docker run -d --name spendwise --network host \
            -e SPENDWISE_DOTENV=0 \
            -e DATABASE_URL=postgresql+asyncpg://ci:ci@localhost:5432/spendwise \
            -e MIGRATION_DATABASE_URL=postgresql+asyncpg://ci:ci@localhost:5432/spendwise \
            -e JWT_SECRET=ci_only_not_a_real_secret_padded_to_32_bytes \
            -e BOOTSTRAP_ADMIN_EMAIL=ci@example.com \
            spendwise:ci

      - name: Wait for the health endpoint
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/healthz; then echo; echo "healthy"; exit 0; fi
            sleep 2
          done
          echo "never became healthy"
          docker logs spendwise
          exit 1

#----------------------------------------
##TESTS THAT DO NOT REQUIRE A DATABASE
#----------------------------------------
  tests:
    name: Tests — no database required
    runs-on: ubuntu-latest
    needs: assemble
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run the tests that need no database
        env:
          SPENDWISE_DOTENV: "0"
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
          MIGRATION_DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
          JWT_SECRET: ci_only_not_a_real_secret_padded_to_32_bytes
        run: pytest -m "not db and not browser"

#---------------------------
##SECRETS SCANNING 
#---------------------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

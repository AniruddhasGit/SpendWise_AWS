<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpendWise</title>
    <meta name="description" content="See where your money went." />
    <meta name="color-scheme" content="light dark" />
    <!-- The page's ONE face, self-hosted (SW-ADR-020). Preloaded so the first
         paint is not set in a fallback and then reflowed. `crossorigin` is
         required for a font preload even on the same origin. -->
    <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#f7f4ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#06140f" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <!-- Skip link, first in the tab order. `SW-ADR-117`: a keyboard user should
         not have to tab through the period picker and nine ribbon bands to
         reach the entry list. -->
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="root"></div>
    <noscript>SpendWise needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

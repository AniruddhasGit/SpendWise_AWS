name: Stamp an image
description: >-
  Adds a promotion tag to an image that is already in ECR, without pulling or
  pushing a single layer, and proves the tag landed on the right manifest.

inputs:
  repository:
    description: ECR repository name
    required: true
  source-tag:
    description: The tag that already points at the image, e.g. sha-a1b2c3d
    required: true
  new-tag:
    description: The stamp to add, e.g. dev-ok-a1b2c3d
    required: true

runs:
  using: composite
  steps:
    # =========================================================================
    # put-image re-registers an EXISTING manifest under a second tag. No layer
    # moves, so this is instant and free regardless of image size. Doing it the
    # obvious way instead - docker pull, docker tag, docker push - would move
    # ~500MB over the wire to achieve exactly the same thing.
    #
    # WHY THIS ASKS FOR A DIGEST AND NOT A TAG
    #   `batch-get-image --image-ids imageTag=X` content-negotiates. A buildx
    #   push creates an image INDEX (a manifest list) plus a platform-specific
    #   child, and ECR will hand back the child unless told otherwise. Stamping
    #   that child produces tags that exist - so the gate passes - but which sit
    #   on a different digest from the one the deploy references:
    #
    #       sha-cc90b35      sha256:989b5f...   <- what gets deployed
    #       uat-ok-cc90b35   sha256:1638bd...   <- what got stamped
    #
    #   Observed on 2026-09-13. The ordering guarantee survived that, because a
    #   stamp still only exists if the environment below succeeded. What did not
    #   survive is the stronger claim - that the stamp is ON the artifact. So:
    #   resolve the tag to its digest, fetch THAT, and verify.
    # =========================================================================
    - name: Copy the manifest onto the new tag
      shell: bash
      run: |
        set -euo pipefail

        DIGEST=$(aws ecr describe-images \
                   --repository-name "${{ inputs.repository }}" \
                   --image-ids imageTag="${{ inputs.source-tag }}" \
                   --query 'imageDetails[0].imageDigest' --output text)

        if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
          echo "::error::${{ inputs.source-tag }} is not in ${{ inputs.repository }}." >&2
          exit 1
        fi
        echo "${{ inputs.source-tag }} -> $DIGEST"

        # Index types first. Asking by digest already pins WHICH object we want;
        # naming the index media types stops ECR substituting a child for it.
        aws ecr batch-get-image \
          --repository-name "${{ inputs.repository }}" \
          --image-ids imageDigest="$DIGEST" \
          --accepted-media-types \
            "application/vnd.oci.image.index.v1+json" \
            "application/vnd.docker.distribution.manifest.list.v2+json" \
            "application/vnd.oci.image.manifest.v1+json" \
            "application/vnd.docker.distribution.manifest.v2+json" \
          --output json > img.json

        # -j, not -r: a trailing newline changes the bytes, and the bytes ARE
        # the digest. That one character would break the check below.
        jq -j '.images[0].imageManifest' img.json > manifest.json
        MEDIA=$(jq -r '.images[0].imageManifestMediaType' img.json)

        if [ ! -s manifest.json ]; then
          echo "::error::ECR returned no manifest for $DIGEST." >&2
          exit 1
        fi

        # A manifest's digest is the sha256 of its exact bytes, so this is a
        # complete check rather than a plausible one: if it matches, the thing
        # about to be stamped is byte-for-byte the thing that gets deployed.
        ACTUAL="sha256:$(sha256sum manifest.json | cut -d' ' -f1)"
        if [ "$ACTUAL" != "$DIGEST" ]; then
          echo "::error::Refusing to stamp. Asked ECR for $DIGEST and it returned $ACTUAL." >&2
          echo "A stamp on the wrong manifest vouches for something other than what ships." >&2
          exit 1
        fi
        echo "verified: manifest hashes to $DIGEST"

        # Re-running a deploy must not fail on the stamp it already wrote.
        # Immutable tags make a repeat PutImage an error, and that error is
        # success in disguise - so catch that one case and only that one.
        if OUT=$(aws ecr put-image \
                   --repository-name "${{ inputs.repository }}" \
                   --image-tag "${{ inputs.new-tag }}" \
                   --image-manifest file://manifest.json \
                   --image-manifest-media-type "$MEDIA" 2>&1); then
          echo "Stamped ${{ inputs.new-tag }} onto $DIGEST"
        elif echo "$OUT" | grep -q 'ImageAlreadyExistsException'; then
          echo "${{ inputs.new-tag }} was already stamped - nothing to do."
        else
          echo "$OUT" >&2
          exit 1
        fi

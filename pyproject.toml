[project]
name = "spendwise"
version = "0.1.0"
description = "A personal expense tracker. A modular monolith: one deployable, six modules with hard internal boundaries."
readme = "README.md"

# LOCKED by SW-ADR-016. The record says: do not substitute, even for something
# better. 3.12 is the ruled version and the container will pin it, so a dev
# machine on a different minor is a dev/prod parity gap, not a convenience.
requires-python = ">=3.12,<3.13"

# The stack, locked by SW-ADR-016 and extended with the test stack by
# SW-ADR-139 (CV-16) — which had named no test tool while Art IX.1 mandates
# failing-test-first and E0-S5 mandates a real browser.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "email-validator>=2.2",   # EmailStr; P-ACC-01 validates the address shape
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",          # >=2.4 is the floor: SW-ADR-080 pins algorithms=["HS256"]
    "bcrypt>=4.2",
    "boto3>=1.35",
    "python-dateutil>=2.9", # CV-23: calendar arithmetic at the year boundary
    # The IANA timezone database. NOT optional and NOT a Windows-only fix:
    # zoneinfo reads the SYSTEM tzdb, Windows ships none at all, and a slim
    # Linux image often omits it too. Without this, ZoneInfo("Asia/Kolkata")
    # raises - and SW-ADR-096 makes that timezone the calendar every boundary
    # in this product is computed in.
    "tzdata>=2024.1",
    # E1-S6 / SW-ADR-128. `SRC-001 §10.9` names `slowapi`; this is the engine
    # slowapi is a thin decorator layer over, used directly because login needs
    # TWO keys (IP and normalised email) and the 429 has to carry both the
    # closed error envelope (`SW-ADR-051`) and a `Retry-After` computed from the
    # window's reset time. Same in-process MemoryStorage, so SW-ADR-128's
    # knowingly-accepted weakness is unchanged. One [JUDGMENT CALL].
    "limits>=3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",          # ASGITransport for in-process API tests
    "playwright>=1.48",     # the browser-observed gate; Art IX.4 requires a real browser
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Art IX.2: never fake, skip, xfail, comment out or delete a test to reach green.
# A red gate blocks — mark the story Blocked and surface it.
addopts = "-q --strict-markers --strict-config"
markers = [
    "gate: the never-waivable day-one proof (CONSTITUTION Art IX.4)",
    "db: requires a live PostgreSQL — not runnable from a bare clone",
    "browser: requires Playwright and a running app",
]

[tool.setuptools.packages.find]
include = ["app*"]

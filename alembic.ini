# Alembic configuration.
#
# NOTE the absent `sqlalchemy.url`. It is deliberately NOT here: env.py reads
# MIGRATION_DATABASE_URL from the typed settings, so a connection string with a
# password can never land in a committed file (CONSTITUTION Art IV.4), and there
# is no second place for it to drift from .env.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Timestamped, sortable revision filenames. The default is a bare hex slug,
# which tells a reader nothing about order when reviewing a directory listing.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
